name: Website checks and Pages deployment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run release:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
        env:
          SITE_VISUAL_AUDIT: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: website-visual-audit
          path: artifacts/visual-audit/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: website-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifacts/pages-build
      - run: mkdir dist && tar -xf artifacts/pages-build/artifact.tar -C dist
      - run: npm ci
      - run: npm run verify:production
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
        env:
          PLAYWRIGHT_PRODUCTION: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-production-verification
          path: |
            artifacts/production-verification.json
            playwright-report/
            test-results/
          retention-days: 7
