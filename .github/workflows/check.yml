name: Publish locally verified website
on:
  workflow_dispatch:
    inputs:
      package_sha256:
        description: SHA-256 of the locally verified release package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Verify the selected local package and extract it
        env:
          EXPECTED_SHA256: ${{ inputs.package_sha256 }}
        run: |
          test "${#EXPECTED_SHA256}" -eq 64
          printf '%s  %s\n' "$EXPECTED_SHA256" '.pages-release/site.tar.gz' | sha256sum --check --strict
          mkdir pages-output
          tar -xzf .pages-release/site.tar.gz -C pages-output
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-output
      - uses: actions/deploy-pages@v5
        id: deployment
